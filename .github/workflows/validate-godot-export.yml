name: Validate Godot Web export

on:
  workflow_run:
    workflows:
      - Build OpenVic Web port
    types:
      - completed
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Optional successful Build OpenVic Web port run ID to reuse
        required: false
        default: ""
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/validate-godot-export.yml"
      - "web/openvic-shell.html"
      - "scripts/prepare_openvic_godot_web.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: validate-godot-web-main
  cancel-in-progress: true

env:
  OPENVIC_COMMIT: d3361890c62ede9464eb41af7f797e87dedf4b28

jobs:
  export-smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout vic2-browser
        uses: actions/checkout@v4

      - name: Resolve reusable native build
        id: native-build
        uses: actions/github-script@v7
        env:
          REQUESTED_BUILD_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.build_run_id || '' }}
        with:
          script: |
            let runId = '';
            if (context.eventName === 'workflow_run') {
              runId = String(context.payload.workflow_run.id);
            } else if (process.env.REQUESTED_BUILD_RUN_ID) {
              runId = process.env.REQUESTED_BUILD_RUN_ID;
            } else {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'build-openvic-web.yml',
                branch: 'main',
                per_page: 20,
              });
              for (const run of runs) {
                if (run.status !== 'completed' || run.conclusion !== 'success') continue;
                const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                  per_page: 100,
                });
                const names = new Set(
                  artifacts.data.artifacts.filter(a => !a.expired).map(a => a.name)
                );
                if (
                  names.has('openvic-web-extension') &&
                  names.has('openvic-linux-editor-extension')
                ) {
                  runId = String(run.id);
                  break;
                }
              }
            }
            if (!runId) {
              core.setFailed('No successful native OpenVic build with both reusable artifacts was found.');
              return;
            }
            core.info('Reusing native build run ' + runId);
            core.setOutput('run_id', runId);

      - name: Download validated wasm artifact
        uses: actions/download-artifact@v4
        with:
          name: openvic-web-extension
          path: engine-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.native-build.outputs.run_id }}

      - name: Download cached Linux editor extension
        uses: actions/download-artifact@v4
        with:
          name: openvic-linux-editor-extension
          path: editor-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.native-build.outputs.run_id }}

      - name: Assert reusable native artifacts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          expected_patch = hashlib.sha256(Path("scripts/patch_openvic_web.py").read_bytes()).hexdigest()
          for folder in ("engine-artifact", "editor-artifact"):
              fingerprint = Path(folder) / "PORT_PATCH_SHA256"
              if not fingerprint.is_file() or fingerprint.read_text().strip() != expected_patch:
                  raise SystemExit(
                      f"{folder} was built with different port patches. "
                      "Run Build OpenVic Web port for this revision before exporting."
                  )

          wasm = Path("engine-artifact/libopenvic.web.template_release.wasm32.threads.wasm")
          magic = wasm.read_bytes()[:8]
          print("OpenVic artifact magic:", magic)
          if magic[:4].hex() != "0061736d":
              raise SystemExit("Downloaded OpenVic artifact is not a WebAssembly binary.")

          linux = Path("editor-artifact/libopenvic.linux.editor.x86_64.so")
          if not linux.is_file() or linux.stat().st_size == 0:
              raise SystemExit("Linux editor extension artifact is missing.")
          print("Linux editor artifact:", linux.stat().st_size, "bytes")
          PY

      - name: Install export runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip libtbb-dev unzip

      - name: Fetch pinned OpenVic source
        run: |
          mkdir -p vendor
          git clone --recursive https://github.com/OpenVicProject/OpenVic.git vendor/OpenVic
          cd vendor/OpenVic
          git checkout --detach "$OPENVIC_COMMIT"
          git submodule update --init --recursive

      - name: Apply current port and Godot Web patches
        run: |
          python3 scripts/patch_openvic_web.py
          python3 scripts/prepare_openvic_godot_web.py

          SHADER="vendor/OpenVic/game/src/Systems/Session/Map/TerrainMap.gdshader"
          if grep -nF 'fma(' "$SHADER"; then
            echo "TerrainMap.gdshader still contains unsupported fma() after Web patch."
            exit 1
          fi
          grep -Fq 'corner * corner_args.half_pixel_size + corner_args.uv' "$SHADER"
          grep -Fq 'uv * map_size + vec2(0.5)' "$SHADER"
          echo "WebGL shader compatibility patch verified."

      - name: Install reusable native extensions into project
        run: |
          mkdir -p vendor/OpenVic/game/bin/openvic
          cp engine-artifact/libopenvic.web.template_release.wasm32.threads.wasm vendor/OpenVic/game/bin/openvic/
          cp editor-artifact/libopenvic.linux.editor.x86_64.so vendor/OpenVic/game/bin/openvic/
          test -s vendor/OpenVic/game/bin/openvic/libopenvic.web.template_release.wasm32.threads.wasm
          test -s vendor/OpenVic/game/bin/openvic/libopenvic.linux.editor.x86_64.so
          grep -F 'web.wasm32.single.release' vendor/OpenVic/game/bin/openvic.gdextension

      - name: Install Godot editor
        run: |
          curl -L --fail --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot*' | head -n 1)"
          test -n "$GODOT"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          "$GODOT" --version

      - name: Install official Web GDExtension template
        run: |
          TEMPLATE_ROOT="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_ROOT"

          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz \
            -o /tmp/godot-export-templates.tpz

          ENTRY="$(unzip -Z1 /tmp/godot-export-templates.tpz | grep 'web_dlink_release.zip$' | head -n 1)"
          test -n "$ENTRY"
          unzip -p /tmp/godot-export-templates.tpz "$ENTRY" > "$TEMPLATE_ROOT/web_dlink_release.zip"
          test -s "$TEMPLATE_ROOT/web_dlink_release.zip"
          unzip -t "$TEMPLATE_ROOT/web_dlink_release.zip"
          rm -f /tmp/godot-export-templates.tpz

      - name: Import project
        run: |
          "$GODOT" --headless --path vendor/OpenVic/game --import

      - name: Export Web project
        run: |
          mkdir -p dist/site
          "$GODOT" --headless --path vendor/OpenVic/game --export-release "Web" "$GITHUB_WORKSPACE/dist/site/index.html"
          find dist/site -maxdepth 1 -type f -printf "%f %k KB\n" | sort
          test -s dist/site/index.html
          test -s dist/site/index.js
          test -s dist/site/index.wasm
          test -s dist/site/index.side.wasm
          test -s dist/site/index.pck
          test -s dist/site/libopenvic.web.template_release.wasm32.threads.wasm
          test -s dist/site/index.service.worker.js
          test -s dist/site/index.manifest.json
          grep -F "Confirmo que os arquivos selecionados pertencem a uma cópia legítima" dist/site/index.html

      - name: Upload export for inspection
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-export-smoke
          path: dist/site
          if-no-files-found: error
          retention-days: 90

      - name: Smoke-test init and real Godot callMain in Chromium
        run: |
          python3 -m pip install --user --break-system-packages playwright

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          export CHROME

          cat >/tmp/serve_openvic.py <<'PYHTTP'
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          from functools import partial

          class Handler(SimpleHTTPRequestHandler):
              def end_headers(self):
                  self.send_header("Cross-Origin-Opener-Policy", "same-origin")
                  self.send_header("Cross-Origin-Embedder-Policy", "require-corp")
                  super().end_headers()

          ThreadingHTTPServer(
              ("127.0.0.1", 8765),
              partial(Handler, directory="dist/site"),
          ).serve_forever()
          PYHTTP
          python3 /tmp/serve_openvic.py >/tmp/openvic-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          python3 - <<'PY'
          import asyncio
          import os
          import time
          from playwright.async_api import async_playwright

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      executable_path=os.environ["CHROME"],
                      args=["--no-sandbox", "--disable-dev-shm-usage"],
                  )
                  page = await browser.new_page()
                  console_lines = []
                  page.on("console", lambda msg: console_lines.append(f"[{msg.type}] {msg.text}"))
                  page.on("pageerror", lambda exc: console_lines.append(f"[pageerror] {exc}"))

                  await page.goto("http://127.0.0.1:8765/", wait_until="domcontentloaded", timeout=30_000)
                  isolated = await page.evaluate("crossOriginIsolated")
                  print("crossOriginIsolated:", isolated)
                  if not isolated:
                      raise SystemExit("Threaded Web smoke test is not cross-origin isolated.")

                  deadline = time.monotonic() + 120
                  last = None
                  while time.monotonic() < deadline:
                      godot = (await page.locator("#godot-state").inner_text()).strip()
                      openvic = (await page.locator("#openvic-state").inner_text()).strip()
                      error = (await page.locator("#error").inner_text()).strip()
                      state = (godot, openvic, error)
                      if state != last:
                          print("runtime state:", state)
                          last = state

                      if godot == "carregado" and openvic == "carregado":
                          break

                      if godot == "falha" or openvic == "falha" or error:
                          print("\n".join(console_lines[-100:]))
                          raise SystemExit(f"Browser runtime failed: {state}")

                      await page.wait_for_timeout(1000)
                  else:
                      print("\n".join(console_lines[-100:]))
                      raise SystemExit(f"Browser runtime timed out: {last}")

                  # Exercise the same init -> copyToFS -> start/callMain path used
                  # by the real launcher, but --help exits before proprietary
                  # Victoria II data is required.
                  await page.evaluate("""async () => {
                      const pack = await copyProjectPack();
                      await engine.start({
                          canvas,
                          args: ['--main-pack', pack, '--', '--help'],
                      });
                  }""")
                  await page.wait_for_timeout(2500)
                  runtime_log = await page.locator("#log").inner_text()
                  if "Usage:" not in runtime_log:
                      print("\n".join(console_lines[-150:]))
                      print(runtime_log[-8000:])
                      raise SystemExit("Godot callMain smoke test did not reach OpenVic --help output.")

                  print("Browser smoke test passed: init + GDExtension + PCK + callMain.")
                  await browser.close()

          asyncio.run(main())
          PY
