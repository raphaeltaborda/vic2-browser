name: Validate Godot Web export

on:
  workflow_run:
    workflows:
      - Build OpenVic Web port
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  export-smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout vic2-browser
        uses: actions/checkout@v4

      - name: Download freshly validated wasm artifact
        uses: actions/download-artifact@v4
        with:
          name: openvic-web-extension
          path: engine-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Assert OpenVic artifact is real WebAssembly
        run: |
          python3 - <<'PY'
          from pathlib import Path

          wasm = Path("engine-artifact/libopenvic.web.template_release.wasm32.nothreads.wasm")
          magic = wasm.read_bytes()[:8]
          print("OpenVic artifact magic:", magic)
          if magic[:4] != b"\\x00asm":
              raise SystemExit("Downloaded OpenVic artifact is not a WebAssembly binary.")
          PY

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 python3-pip pkg-config libtbb-dev unzip

      - name: Fetch pinned OpenVic source
        run: |
          mkdir -p vendor
          git clone --recursive https://github.com/OpenVicProject/OpenVic.git vendor/OpenVic
          cd vendor/OpenVic
          git checkout --detach d3361890c62ede9464eb41af7f797e87dedf4b28
          git submodule update --init --recursive

      - name: Apply current port and Godot Web patches
        run: |
          python3 scripts/patch_openvic_web.py
          python3 scripts/prepare_openvic_godot_web.py

      - name: Build Linux editor extension
        working-directory: vendor/OpenVic
        run: |
          cmake --preset linux-x64-editor -DOPENVIC_USE_PCH=OFF -DOPENVIC_SIM_BUILD_HEADLESS=OFF -DOPENVIC_SIM_BUILD_TESTS=OFF -DOPENVIC_SIM_BUILD_BENCHMARKS=OFF
          cmake --build --preset linux-x64-editor --parallel 4

      - name: Install wasm into project
        run: |
          cp engine-artifact/libopenvic.web.template_release.wasm32.nothreads.wasm vendor/OpenVic/game/bin/openvic/
          grep -F 'web.wasm32.single.release' vendor/OpenVic/game/bin/openvic.gdextension

      - name: Install Godot editor
        run: |
          curl -L --fail --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot*' | head -n 1)"
          test -n "$GODOT"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          "$GODOT" --version

      - name: Install official Web GDExtension template
        run: |
          TEMPLATE_ROOT="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_ROOT"

          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz \
            -o /tmp/godot-export-templates.tpz

          ENTRY="$(unzip -Z1 /tmp/godot-export-templates.tpz | grep 'web_dlink_nothreads_release.zip$' | head -n 1)"
          test -n "$ENTRY"
          unzip -p /tmp/godot-export-templates.tpz "$ENTRY" > "$TEMPLATE_ROOT/web_dlink_nothreads_release.zip"
          test -s "$TEMPLATE_ROOT/web_dlink_nothreads_release.zip"
          unzip -t "$TEMPLATE_ROOT/web_dlink_nothreads_release.zip"
          ls -lh "$TEMPLATE_ROOT/web_dlink_nothreads_release.zip"
          rm -f /tmp/godot-export-templates.tpz

      - name: Import project
        run: |
          "$GODOT" --headless --path vendor/OpenVic/game --import

      - name: Export Web project
        run: |
          mkdir -p dist/site
          "$GODOT" --headless --path vendor/OpenVic/game --export-release "Web" "$GITHUB_WORKSPACE/dist/site/index.html"
          find dist/site -maxdepth 1 -type f -printf "%f %k KB\n" | sort
          test -s dist/site/index.html
          test -s dist/site/index.js
          test -s dist/site/index.wasm
          test -s dist/site/index.side.wasm
          grep -F "Confirmo que os arquivos selecionados pertencem a uma cópia legítima" dist/site/index.html

      - name: Upload export for inspection
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-export-smoke
          path: dist/site
          if-no-files-found: error
