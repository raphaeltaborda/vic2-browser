name: Stage 4 definition-loader harness

on:
  push:
    branches:
      - main
    paths:
      - 'stage4/**'
      - 'patches/**'
      - 'scripts/ci/**'
      - 'scripts/lib/browser-smoke.mjs'
      - 'scripts/apply-portability-patches.sh'
      - 'scripts/stage4-browser-smoke.mjs'
      - 'scripts/stage4-pages-smoke.mjs'
      - '.github/workflows/build-openvic-wasm.yml'
      - 'docs/BUILD_STAGE_4.md'
      - '.github/workflows/stage4-definition-loader.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stage4-definition-loader-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_TAG: 4.7.2-stable
  GODOT_LINUX_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
  GODOT_TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011

jobs:
  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout port repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Resolve newest Stage 1 run
        id: stage1
        env:
          GH_TOKEN: ${{ github.token }}
          PREFER_STAGE1_SHA: ${{ github.sha }}
        run: bash scripts/ci/resolve-stage1.sh main

      - name: Download validated Stage 1 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: openvic-wasm-stage1
          path: stage1-artifact
          github-token: ${{ github.token }}
          run-id: ${{ steps.stage1.outputs.run_id }}

      - name: Verify and install Stage 1 payload
        run: bash scripts/ci/install-stage1-payload.sh stage1-artifact stage4 "${{ steps.stage1.outputs.head_sha }}"

      - name: Install verified Godot Web toolchain
        run: bash scripts/ci/install-godot-web.sh

      - name: Export Stage 4 harness
        run: |
          bash scripts/ci/export-godot-web.sh stage4 build/stage4 'Stage 4 · OpenVic definition loader'
          sed -i "s/__OPENVIC_BUILD_SHA__/$GITHUB_SHA/g" build/stage4/index.html
          sed -i "s/__OPENVIC_STAGE1_SHA__/${{ steps.stage1.outputs.head_sha }}/g" build/stage4/index.html
          ! grep -Fq '__OPENVIC_BUILD_SHA__' build/stage4/index.html
          ! grep -Fq '__OPENVIC_STAGE1_SHA__' build/stage4/index.html
          test -s build/stage4/index.service.worker.js

      - name: Browser harness smoke test
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
          export CHROME="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROME"
          node scripts/stage4-browser-smoke.mjs build/stage4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build/stage4

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: harness
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  verify-pages:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      STAGE4_PAGE_URL: ${{ needs.deploy.outputs.page_url }}?build=${{ github.sha }}
      EXPECTED_STAGE4_BUILD: ${{ github.sha }}
    steps:
      - name: Checkout port repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Verify public GitHub Pages runtime
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
          export CHROME="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROME"
          node scripts/stage4-pages-smoke.mjs
