name: Stage 3 OpenVic filesystem smoke

on:
  push:
    branches:
      - main
    paths:
      - 'stage3/**'
      - 'scripts/ci/**'
      - 'scripts/lib/browser-smoke.mjs'
      - 'scripts/stage3-browser-smoke.mjs'
      - 'docs/BUILD_STAGE_3.md'
      - '.github/workflows/stage3-filesystem-smoke.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: stage3-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_TAG: 4.7.2-stable
  GODOT_LINUX_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
  GODOT_TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011

jobs:
  filesystem:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout port repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Resolve newest Stage 1 run
        id: stage1
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/resolve-stage1.sh main

      - name: Download validated Stage 1 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: openvic-wasm-stage1
          path: stage1-artifact
          github-token: ${{ github.token }}
          run-id: ${{ steps.stage1.outputs.run_id }}

      - name: Verify and install Stage 1 payload
        run: bash scripts/ci/install-stage1-payload.sh stage1-artifact stage3 "${{ steps.stage1.outputs.head_sha }}"

      - name: Install verified Godot Web toolchain
        run: bash scripts/ci/install-godot-web.sh

      - name: Export Stage 3 Web project
        run: bash scripts/ci/export-godot-web.sh stage3 build/stage3 'STAGE3_DEFINES_SENTINEL'

      - name: Browser smoke test
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
          export CHROME="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROME"
          node scripts/stage3-browser-smoke.mjs build/stage3

      - name: Upload Stage 3 Web project artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openvic-stage3-filesystem-smoke
          path: build/stage3
          if-no-files-found: error
          retention-days: 30
