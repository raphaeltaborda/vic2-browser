name: Build OpenVic Web port

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-openvic-web.yml"
      - "scripts/patch_openvic_web.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm-extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout vic2-browser
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 python3-pip pkg-config

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.12
          actions-cache-folder: emsdk-cache

      - name: Verify Emscripten
        run: |
          emcc --version
          em++ --version

      - name: Fetch pinned OpenVic source
        run: |
          mkdir -p vendor
          git clone --recursive https://github.com/OpenVicProject/OpenVic.git vendor/OpenVic
          cd vendor/OpenVic
          git checkout --detach d3361890c62ede9464eb41af7f797e87dedf4b28
          git submodule update --init --recursive

      - name: Apply web port patch
        run: python3 scripts/patch_openvic_web.py

      - name: Configure OpenVic for WebAssembly
        run: |
          emcmake cmake             -S vendor/OpenVic             -B build/openvic-web             -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DGODOTCPP_TARGET=template_release             -DGODOTCPP_THREADS=OFF             -DGODOTCPP_PRECISION=single             -DOPENVIC_USE_PCH=OFF             -DOPENVIC_SIM_BUILD_HEADLESS=OFF             -DOPENVIC_SIM_BUILD_TESTS=OFF             -DOPENVIC_SIM_BUILD_BENCHMARKS=OFF

      - name: Build OpenVic WebAssembly extension
        run: |
          cmake --build build/openvic-web --target openvic --parallel 2
          echo "=== WebAssembly outputs ==="
          find build/openvic-web vendor/OpenVic/game/bin/openvic -type f             \( -name "*.wasm" -o -name "*.a" \) -printf "%p %k KB\n" | sort

      - name: Collect extension
        run: |
          mkdir -p dist/engine
          WASM="$(find build/openvic-web -type f -name 'libopenvic*.wasm' | head -n 1)"
          test -n "$WASM"
          cp "$WASM" dist/engine/libopenvic.web.template_release.wasm32.nothreads.wasm
          cp vendor/OpenVic/game/bin/openvic.gdextension dist/engine/openvic.gdextension
          printf '%s\n' 'd3361890c62ede9464eb41af7f797e87dedf4b28' > dist/engine/OPENVIC_COMMIT
          ls -lh dist/engine

      - name: Upload WebAssembly engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: openvic-web-extension
          path: dist/engine
          if-no-files-found: error
