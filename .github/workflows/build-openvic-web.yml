name: Build OpenVic Web port

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/build-openvic-web.yml"
      - "scripts/patch_openvic_web.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openvic-native-main
  cancel-in-progress: true

env:
  OPENVIC_COMMIT: d3361890c62ede9464eb41af7f797e87dedf4b28
  EMSCRIPTEN_VERSION: 4.0.20
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPRESS: "true"

jobs:
  wasm-extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout vic2-browser
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 pkg-config ccache

      - name: Restore wasm compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: openvic-wasm-threads-ccache-${{ runner.os }}-${{ env.EMSCRIPTEN_VERSION }}-${{ env.OPENVIC_COMMIT }}-${{ hashFiles('scripts/patch_openvic_web.py') }}
          restore-keys: |
            openvic-wasm-threads-ccache-${{ runner.os }}-${{ env.EMSCRIPTEN_VERSION }}-${{ env.OPENVIC_COMMIT }}-

      - name: Install Emscripten matching Godot 4.7.2
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}

      - name: Verify toolchain
        run: |
          emcc --version
          em++ --version
          cmake --version
          ninja --version
          ccache --version
          ccache --zero-stats

      - name: Fetch pinned OpenVic source
        run: |
          mkdir -p vendor
          git clone --recursive https://github.com/OpenVicProject/OpenVic.git vendor/OpenVic
          cd vendor/OpenVic
          git checkout --detach "$OPENVIC_COMMIT"
          git submodule update --init --recursive

      - name: Apply WebAssembly port patches
        run: python3 scripts/patch_openvic_web.py

      - name: Configure OpenVic for wasm32 pthreads
        run: |
          emcmake cmake \
            -S vendor/OpenVic \
            -B build/openvic-web \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DGODOTCPP_TARGET=template_release \
            -DGODOTCPP_THREADS=ON \
            -DCMAKE_C_FLAGS=-pthread \
            -DCMAKE_CXX_FLAGS=-pthread \
            -DGODOTCPP_PRECISION=single \
            -DOPENVIC_USE_PCH=OFF \
            -DOPENVIC_SIM_BUILD_HEADLESS=OFF \
            -DOPENVIC_SIM_BUILD_TESTS=OFF \
            -DOPENVIC_SIM_BUILD_BENCHMARKS=OFF

      - name: Patch legacy foonathan-memory libc++ ABI references
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("build/openvic-web/_deps/memory-src")
          changed = 0
          for path in root.rglob("*.hpp"):
              source = path.read_text(encoding="utf-8")
              if "std::__1::" not in source:
                  continue
              path.write_text(
                  source.replace("std::__1::", "std::_LIBCPP_ABI_NAMESPACE::"),
                  encoding="utf-8",
              )
              changed += 1
          print(f"Patched {changed} foonathan-memory header(s).")
          PY

      - name: Build OpenVic WebAssembly extension
        run: |
          cmake --build build/openvic-web --target openvic --parallel 4
          ccache --show-stats

      - name: Collect and validate extension
        run: |
          mkdir -p dist/engine
          WASM="$(find build/openvic-web -type f -name 'libopenvic*.wasm' | head -n 1)"
          test -n "$WASM"

          cp "$WASM" dist/engine/libopenvic.web.template_release.wasm32.threads.wasm
          cp vendor/OpenVic/game/bin/openvic.gdextension dist/engine/openvic.gdextension
          printf '%s\n' "$OPENVIC_COMMIT" > dist/engine/OPENVIC_COMMIT
          printf '%s\n' "$EMSCRIPTEN_VERSION" > dist/engine/EMSCRIPTEN_VERSION

          test -s dist/engine/libopenvic.web.template_release.wasm32.threads.wasm
          grep -Fq 'web.wasm32.single.release' dist/engine/openvic.gdextension

          python3 - <<'PY'
          from pathlib import Path

          wasm = Path("dist/engine/libopenvic.web.template_release.wasm32.threads.wasm")
          magic = wasm.read_bytes()[:8]
          print("OpenVic artifact magic:", magic)
          if magic[:4].hex() != "0061736d":
              raise SystemExit(
                  "OpenVic artifact is not a WebAssembly binary. "
                  "A static ar archive with a .wasm suffix must never be published."
              )
          PY

          file dist/engine/libopenvic.web.template_release.wasm32.threads.wasm
          ls -lh dist/engine

      - name: Upload WebAssembly engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: openvic-web-extension
          path: dist/engine
          if-no-files-found: error
          retention-days: 90

  linux-editor-extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout vic2-browser
        uses: actions/checkout@v4

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 pkg-config libtbb-dev ccache

      - name: Restore Linux editor compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: openvic-linux-editor-ccache-${{ runner.os }}-${{ env.OPENVIC_COMMIT }}-${{ hashFiles('scripts/patch_openvic_web.py') }}
          restore-keys: |
            openvic-linux-editor-ccache-${{ runner.os }}-${{ env.OPENVIC_COMMIT }}-

      - name: Fetch pinned OpenVic source
        run: |
          mkdir -p vendor
          git clone --recursive https://github.com/OpenVicProject/OpenVic.git vendor/OpenVic
          cd vendor/OpenVic
          git checkout --detach "$OPENVIC_COMMIT"
          git submodule update --init --recursive

      - name: Apply native port patches
        run: python3 scripts/patch_openvic_web.py

      - name: Build Linux editor extension
        working-directory: vendor/OpenVic
        run: |
          ccache --zero-stats
          cmake --preset linux-x64-editor \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DOPENVIC_USE_PCH=OFF \
            -DOPENVIC_SIM_BUILD_HEADLESS=OFF \
            -DOPENVIC_SIM_BUILD_TESTS=OFF \
            -DOPENVIC_SIM_BUILD_BENCHMARKS=OFF
          cmake --build --preset linux-x64-editor --target openvic --parallel 4
          ccache --show-stats

      - name: Collect Linux editor extension
        run: |
          mkdir -p dist/editor
          LIB="$(find vendor/OpenVic/game/bin/openvic -type f -name 'libopenvic.linux.editor.x86_64.so' | head -n 1)"
          test -n "$LIB"
          cp "$LIB" dist/editor/libopenvic.linux.editor.x86_64.so
          strip --strip-unneeded dist/editor/libopenvic.linux.editor.x86_64.so
          test -s dist/editor/libopenvic.linux.editor.x86_64.so
          nm -D dist/editor/libopenvic.linux.editor.x86_64.so | grep -F 'openvic_library_init'
          file dist/editor/libopenvic.linux.editor.x86_64.so
          ls -lh dist/editor

      - name: Upload Linux editor artifact
        uses: actions/upload-artifact@v4
        with:
          name: openvic-linux-editor-extension
          path: dist/editor
          if-no-files-found: error
          retention-days: 90
