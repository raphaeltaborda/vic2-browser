name: Export native Victoria II web port

on:
  workflow_run:
    workflows: ["Build OpenVic Web port"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "native-pages"
  cancel-in-progress: true

jobs:
  export-and-deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout vic2-browser
        uses: actions/checkout@v4

      - name: Download WebAssembly engine from build run
        uses: actions/download-artifact@v4
        with:
          name: openvic-web-extension
          path: engine-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake python3 python3-pip pkg-config libtbb-dev unzip

      - name: Fetch pinned OpenVic source
        run: |
          mkdir -p vendor
          git clone --recursive https://github.com/OpenVicProject/OpenVic.git vendor/OpenVic
          cd vendor/OpenVic
          git checkout --detach d3361890c62ede9464eb41af7f797e87dedf4b28
          git submodule update --init --recursive

      - name: Apply Web port patches
        run: |
          python3 scripts/patch_openvic_web.py
          cp web/openvic-shell.html vendor/OpenVic/game/web_shell.html

          python3 - <<'PY'
          from pathlib import Path

          root = Path("vendor/OpenVic")
          project = root / "game/project.godot"
          text = project.read_text(encoding="utf-8")
          text = text.replace(
              'config/features=PackedStringArray("4.7", "Forward Plus")',
              'config/features=PackedStringArray("4.7", "GL Compatibility")'
          )
          render = "[rendering]\n\n"
          if "renderer/rendering_method=" not in text:
              text = text.replace(
                  render,
                  render +
                  'renderer/rendering_method="gl_compatibility"\n'
                  'renderer/rendering_method.mobile="gl_compatibility"\n'
              )
          project.write_text(text, encoding="utf-8")

          window = root / "game/src/Autoload/WindowOverride.gd"
          w = window.read_text(encoding="utf-8")
          w = w.replace(
              "func _init() -> void:\n",
              'func _init() -> void:\n\tif OS.has_feature("web"): return\n',
              1
          )
          w = w.replace(
              "func _ready() -> void:\n",
              'func _ready() -> void:\n\tif OS.has_feature("web"): return\n',
              1
          )
          window.write_text(w, encoding="utf-8")

          presets = root / "game/export_presets.cfg"
          p = presets.read_text(encoding="utf-8")
          p = p.replace('macOS="MacOS"\n', 'macOS="MacOS"\nWeb="Web"\n', 1)
          p += r'''

[preset.3]

name="Web"
platform="Web"
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.txt"
exclude_filter="addons/gdUnit4/*/*, test/*"
export_path="export/Web/index.html"
patches=PackedStringArray()
patch_delta_encoding=false
patch_delta_compression_level_zstd=19
patch_delta_min_reduction=0.1
patch_delta_include_filters="*"
patch_delta_exclude_filters=""
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.3.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=true
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell="res://web_shell.html"
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
'''
          presets.write_text(p, encoding="utf-8")
          PY

      - name: Build temporary Linux OpenVic extension for Godot editor
        working-directory: vendor/OpenVic
        run: |
          cmake --preset linux-x64-template_release             -DOPENVIC_USE_PCH=OFF             -DOPENVIC_SIM_BUILD_HEADLESS=OFF             -DOPENVIC_SIM_BUILD_TESTS=OFF             -DOPENVIC_SIM_BUILD_BENCHMARKS=OFF
          cmake --build --preset linux-x64-template_release --parallel 4

      - name: Install WebAssembly OpenVic extension into project
        run: |
          mkdir -p vendor/OpenVic/game/bin/openvic
          cp engine-artifact/libopenvic.web.template_release.wasm32.nothreads.wasm             vendor/OpenVic/game/bin/openvic/
          cp engine-artifact/openvic.gdextension             vendor/OpenVic/game/bin/openvic/openvic.gdextension
          ls -lh vendor/OpenVic/game/bin/openvic

      - name: Download Godot 4.7.2 Linux editor
        run: |
          curl -L --fail --retry 3             https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip             -o /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot*' | head -n1)"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          "$GODOT" --version

      - name: Fetch only the Web-with-extensions single-thread export template
        run: |
          python3 -m pip install --user remotezip
          python3 - <<'PY'
          from pathlib import Path
          from remotezip import RemoteZip

          url = "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          out = Path.home() / ".local/share/godot/export_templates/4.7.2.stable"
          out.mkdir(parents=True, exist_ok=True)

          with RemoteZip(url) as archive:
              candidates = [
                  n for n in archive.namelist()
                  if n.endswith("/web_dlink_nothreads_release.zip")
                  or n == "web_dlink_nothreads_release.zip"
              ]
              if not candidates:
                  raise SystemExit("web_dlink_nothreads_release.zip not found in official templates package")
              data = archive.read(candidates[0])

          target = out / "web_dlink_nothreads_release.zip"
          target.write_bytes(data)
          print(target, target.stat().st_size)
          PY

      - name: Import OpenVic Godot project
        run: |
          "$GODOT" --headless --path vendor/OpenVic/game --import

      - name: Export native Web port
        run: |
          mkdir -p dist/site
          "$GODOT" --headless --path vendor/OpenVic/game             --export-release "Web" "$GITHUB_WORKSPACE/dist/site/index.html"
          echo "=== Native web export ==="
          find dist/site -maxdepth 1 -type f -printf "%f %k KB\n" | sort

      - name: Assert no Victoria II proprietary data entered the build
        run: |
          test ! -e dist/site/v2game.exe
          test ! -e dist/site/victoria2.exe
          if find dist/site -type f \( -iname 'provinces.bmp' -o -iname 'definition.csv' \) | grep -q .; then
            echo "Proprietary Victoria II data unexpectedly found in site artifact"
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload native site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

      - name: Deploy native site
        id: deployment
        uses: actions/deploy-pages@v4
