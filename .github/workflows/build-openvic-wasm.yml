name: Build clean OpenVic WASM

on:
  push:
    branches:
      - web-port-v2
    paths:
      - 'patches/**'
      - 'scripts/apply-openvic-patches.sh'
      - '.github/workflows/build-openvic-wasm.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-openvic-wasm-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENVIC_COMMIT: d3361890c62ede9464eb41af7f797e87dedf4b28
  EMSCRIPTEN_VERSION: 4.0.20

jobs:
  wasm-extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout vic2-browser
        uses: actions/checkout@v4

      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}

      - name: Verify toolchain
        run: |
          emcc --version
          em++ --version
          cmake --version
          ninja --version

      - name: Fetch pinned OpenVic
        run: |
          mkdir -p vendor
          git clone https://github.com/OpenVicProject/OpenVic.git vendor/OpenVic
          git -C vendor/OpenVic checkout --detach "$OPENVIC_COMMIT"
          git -C vendor/OpenVic submodule update --init --recursive

      - name: Apply minimal Web patch series
        run: bash scripts/apply-openvic-patches.sh vendor/OpenVic

      - name: Configure wasm32 pthread build
        run: |
          emcmake cmake             -S vendor/OpenVic             -B build/openvic-web             -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DGODOTCPP_TARGET=template_release             -DGODOTCPP_THREADS=ON             -DGODOTCPP_PRECISION=single             -DOPENVIC_USE_PCH=OFF             -DOPENVIC_SIM_BUILD_HEADLESS=OFF             -DOPENVIC_SIM_BUILD_TESTS=OFF             -DOPENVIC_SIM_BUILD_BENCHMARKS=OFF             -DCMAKE_C_FLAGS=-pthread             -DCMAKE_CXX_FLAGS=-pthread

      - name: Build OpenVic WebAssembly extension
        run: cmake --build build/openvic-web --target openvic --parallel 4

      - name: Validate WebAssembly artifact
        run: |
          mkdir -p dist/engine

          WASM="$(find build/openvic-web -type f -name 'libopenvic*.wasm' -print -quit)"
          test -n "$WASM"
          cp "$WASM" dist/engine/libopenvic.web.template_release.wasm32.threads.wasm
          cp vendor/OpenVic/game/bin/openvic.gdextension dist/engine/openvic.gdextension

          printf '%s\n' "$OPENVIC_COMMIT" > dist/engine/OPENVIC_COMMIT
          printf '%s\n' "$EMSCRIPTEN_VERSION" > dist/engine/EMSCRIPTEN_VERSION

          test -s dist/engine/libopenvic.web.template_release.wasm32.threads.wasm
          grep -Fq 'web.wasm32.single.release' dist/engine/openvic.gdextension

          python3 - <<'PY'
          from pathlib import Path

          path = Path("dist/engine/libopenvic.web.template_release.wasm32.threads.wasm")
          header = path.read_bytes()[:4]
          if header != b"\x00asm":
              raise SystemExit(f"Not a WebAssembly binary: magic={header.hex()}")
          print(f"Validated WebAssembly binary: {path} ({path.stat().st_size} bytes)")
          PY

          file dist/engine/libopenvic.web.template_release.wasm32.threads.wasm
          ls -lh dist/engine

      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: clean-openvic-web-extension
          path: dist/engine
          if-no-files-found: error
          retention-days: 30
