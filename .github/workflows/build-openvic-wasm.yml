name: Build clean OpenVic WASM

on:
  push:
    branches:
      - web-port-v2
    paths:
      - 'patches/openvic/**'
      - 'patches/openvic-scripts/**'
      - 'patches/openvic-simulation/**'
      - 'scripts/apply-portability-patches.sh'
      - 'scripts/validate-stage1-wasm.mjs'
      - '.github/workflows/build-openvic-wasm.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage1-wasm-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENVIC_COMMIT: d3361890c62ede9464eb41af7f797e87dedf4b28
  OPENVIC_SCRIPTS_COMMIT: 8f83cabf147de7d8a511b4aaefd137777c4eb9c8
  OPENVIC_SIMULATION_COMMIT: b7f5feb25b4bc83307489afd5e5d76e50a4915cc
  EMSCRIPTEN_VERSION: 4.0.20

jobs:
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout port repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}

      - name: Verify host tools and repository scripts
        run: |
          set -euo pipefail
          cmake --version
          ninja --version
          em++ --version
          node --version
          bash -n scripts/apply-portability-patches.sh
          node --check scripts/validate-stage1-wasm.mjs

      - name: Fetch pinned OpenVic sources
        run: |
          set -euo pipefail
          mkdir -p vendor

          git clone https://github.com/OpenVicProject/OpenVic.git vendor/OpenVic
          git -C vendor/OpenVic checkout --detach "$OPENVIC_COMMIT"
          git -C vendor/OpenVic submodule update --init --recursive

          git clone https://github.com/OpenVicProject/scripts.git vendor/OpenVic-scripts
          git -C vendor/OpenVic-scripts checkout --detach "$OPENVIC_SCRIPTS_COMMIT"

      - name: Apply isolated portability patches
        run: bash scripts/apply-portability-patches.sh vendor/OpenVic vendor/OpenVic-scripts

      - name: Configure wasm32 pthread build
        run: |
          set -euo pipefail

          cmake_args=(
            -S vendor/OpenVic
            -B build/openvic-wasm
            -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DGODOTCPP_TARGET=template_release
            -DGODOTCPP_THREADS=ON
            -DGODOTCPP_PRECISION=single
            -DOPENVIC_USE_PCH=OFF
            -DOPENVIC_SIM_BUILD_HEADLESS=OFF
            -DOPENVIC_SIM_BUILD_TESTS=OFF
            -DOPENVIC_SIM_BUILD_BENCHMARKS=OFF
            "-DFETCHCONTENT_SOURCE_DIR_OPENVIC_SCRIPTS=$GITHUB_WORKSPACE/vendor/OpenVic-scripts"
            -DCMAKE_CXX_FLAGS=-pthread
          )

          emcmake cmake "${cmake_args[@]}"

      - name: Build OpenVic side module
        run: |
          set -euo pipefail
          cmake --build build/openvic-wasm --target openvic --parallel 4

      - name: Validate and package WebAssembly side module
        run: |
          set -euo pipefail

          mapfile -t wasm_files < <(find build/openvic-wasm -type f -name 'libopenvic*.wasm' -print)
          if [[ "${#wasm_files[@]}" -ne 1 ]]; then
            printf 'Expected exactly one OpenVic WASM artifact, found %s\n' "${#wasm_files[@]}" >&2
            printf '%s\n' "${wasm_files[@]}" >&2
            exit 1
          fi

          WASM="${wasm_files[0]}"
          GDEXTENSION="vendor/OpenVic/game/bin/openvic.gdextension"

          test -s "$WASM"
          node scripts/validate-stage1-wasm.mjs "$WASM"
          grep -Fqx 'web.wasm32.single.release = "res://bin/openvic/libopenvic.web.template_release.wasm32.threads.wasm"' "$GDEXTENSION"

          mkdir -p dist/bin/openvic
          mkdir -p dist/licenses
          mkdir -p dist/patches/openvic
          mkdir -p dist/patches/openvic-scripts
          mkdir -p dist/patches/openvic-simulation

          cp "$WASM" dist/bin/openvic/libopenvic.web.template_release.wasm32.threads.wasm
          cp "$GDEXTENSION" dist/bin/openvic/openvic.gdextension
          cp THIRD_PARTY_NOTICES.md dist/licenses/THIRD_PARTY_NOTICES.md
          cp vendor/OpenVic/LICENSE.md dist/licenses/OpenVic-LICENSE.md
          cp vendor/OpenVic/COPYRIGHT dist/licenses/OpenVic-COPYRIGHT
          cp patches/openvic/0001-emscripten-side-module.patch dist/patches/openvic/
          cp patches/openvic/0002-web-gdextension-library.patch dist/patches/openvic/
          cp patches/openvic-scripts/0001-portable-libcpp-abi-namespace.patch dist/patches/openvic-scripts/
          cp patches/openvic-simulation/0001-wasm32-size-t-hashing.patch dist/patches/openvic-simulation/

          printf '%s\n' "$GITHUB_SHA" > dist/PORT_COMMIT
          printf '%s\n' "$OPENVIC_COMMIT" > dist/OPENVIC_COMMIT
          printf '%s\n' "$OPENVIC_SCRIPTS_COMMIT" > dist/OPENVIC_SCRIPTS_COMMIT
          printf '%s\n' "$OPENVIC_SIMULATION_COMMIT" > dist/OPENVIC_SIMULATION_COMMIT
          printf '%s\n' "$EMSCRIPTEN_VERSION" > dist/EMSCRIPTEN_VERSION

          (
            cd dist
            sha256sum bin/openvic/libopenvic.web.template_release.wasm32.threads.wasm > WASM_SHA256
            sha256sum bin/openvic/openvic.gdextension > GDEXTENSION_SHA256
            sha256sum patches/openvic/0001-emscripten-side-module.patch > PATCHES_SHA256
            sha256sum patches/openvic/0002-web-gdextension-library.patch >> PATCHES_SHA256
            sha256sum patches/openvic-scripts/0001-portable-libcpp-abi-namespace.patch >> PATCHES_SHA256
            sha256sum patches/openvic-simulation/0001-wasm32-size-t-hashing.patch >> PATCHES_SHA256

            sha256sum -c WASM_SHA256
            sha256sum -c GDEXTENSION_SHA256
            sha256sum -c PATCHES_SHA256
          )

          find dist -type f -print | sort

      - name: Upload validated WASM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openvic-wasm-stage1
          path: dist
          if-no-files-found: error
          retention-days: 90
