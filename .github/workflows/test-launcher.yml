name: Repository checks

on:
  pull_request:
    paths:
      - 'stage2/**'
      - 'stage3/**'
      - 'stage4/**'
      - 'tests/**'
      - 'scripts/**'
      - 'patches/**'
      - 'docs/**'
      - 'README.md'
      - 'THIRD_PARTY_NOTICES.md'
      - '.editorconfig'
      - '.gitattributes'
      - '.github/workflows/*.yml'
  push:
    branches:
      - main
    paths:
      - 'stage2/**'
      - 'stage3/**'
      - 'stage4/**'
      - 'tests/**'
      - 'scripts/**'
      - 'patches/**'
      - 'docs/**'
      - 'README.md'
      - 'THIRD_PARTY_NOTICES.md'
      - '.editorconfig'
      - '.gitattributes'
      - '.github/workflows/*.yml'

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Check repository, JavaScript and shell syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find scripts tests -type f \( -name '*.mjs' -o -name '*.cjs' \) -print0)
          while IFS= read -r -d '' file; do bash -n "$file"; done < <(find scripts -type f -name '*.sh' -print0)
          node scripts/audit-foundation.mjs

      - name: Test deployed Stage 4 shell behavior
        run: node --test tests/stage4-shell.test.cjs

      - name: Check Stage 4 browser layout with a stub engine
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
          export CHROME="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROME"
          node tests/stage4-shell.browser.cjs

      - name: Upload Stage 4 previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stage4-previews
          path: build/screenshots
          if-no-files-found: ignore
          retention-days: 30
