<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victoria II Browser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <h1>Victoria II Browser</h1>
        <p>Primeiro teste: localizar os arquivos do jogo no seu computador.</p>

        <label class="folder-button">
            Selecionar pasta do Victoria II
            <input id="game-folder" type="file" webkitdirectory multiple>
        </label>

        <div id="status" class="status">
            Nenhuma pasta selecionada.
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
